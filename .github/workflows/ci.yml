name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: make install
      - run: make lint
      - run: make coverage

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t llm-gateway:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --name gw -p 8000:8000 -e GATEWAY_API_KEYS=ci llm-gateway:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs localhost:8000/metrics | grep -q llmgw_requests_total
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/v1/models)" = "401"

  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render with kustomize
        run: kubectl kustomize k8s/ > rendered.yaml
      - name: Validate against Kubernetes schemas
        run: |
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -kubernetes-version 1.31.0 /work/rendered.yaml

  alert-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Prometheus config and unit-test the alert rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/p" -w /p --entrypoint promtool \
            prom/prometheus:v2.54.1 check rules alerts.yml
          docker run --rm -v "$PWD/deploy/prometheus:/p" -w /p --entrypoint promtool \
            prom/prometheus:v2.54.1 test rules alerts_test.yml

  k8s-deploy:
    # Deploy the manifests to a throwaway kind cluster. Static validation (kubeconform) did
    # not catch the Service-link env var (GATEWAY_PORT=tcp://...) that crashed every pod on a
    # real cluster; this job would have. No Ollama here, so it checks liveness, readiness
    # (Redis), auth and metrics, not generation.
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t llm-gateway:local .
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - name: Deploy and probe through the Service
        run: |
          kind load docker-image llm-gateway:local --name ci
          kubectl apply -f k8s/namespace.yaml
          kubectl -n llm-gateway create secret generic llm-gateway-secrets \
            --from-literal=GATEWAY_API_KEYS=ci-key \
            --from-literal=POSTGRES_PASSWORD=ci-password \
            --from-literal=LEDGER_DATABASE_URL=postgresql://llmgw:ci-password@postgres:5432/llmgw
          kubectl apply -k k8s/
          kubectl -n llm-gateway rollout status statefulset/redis --timeout=180s
          kubectl -n llm-gateway rollout status deploy/gateway --timeout=240s
          kubectl -n llm-gateway port-forward svc/gateway 8000:8000 &
          sleep 5
          curl -fs localhost:8000/livez
          curl -fs localhost:8000/readyz
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/v1/models)" = "401"
          curl -fs localhost:8000/v1/models -H 'Authorization: Bearer ci-key' | grep -q llama3.2
          curl -fs localhost:8000/metrics | grep -q llmgw_requests_total
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl -n llm-gateway get pods -o wide
          kubectl -n llm-gateway describe deploy/gateway | tail -30
          kubectl -n llm-gateway logs deploy/gateway --tail=50 || true
